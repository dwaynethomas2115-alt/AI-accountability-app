<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F8F5EF">
  <title>Kindred garden concepts</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F8F5EF; color: #243E36; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1740px; margin: auto; padding: 32px 20px 56px; }
    h1 { font-size: clamp(26px, 4vw, 44px); font-weight: 500; letter-spacing: -.04em; text-align: center; margin: 0 0 10px; }
    p { text-align: center; color: #5F7066; line-height: 1.5; margin: 0 auto 24px; max-width: 700px; }
    img { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 10px 40px #354d4020; }
    .hint { font-size: 14px; margin-top: 22px; }
    a { color: #355F50; }
  </style>
</head>
<body>
  <main>
    <h1>Choose a garden for Kindred</h1>
    <p>Three ideas for your simple home screen. Every one keeps the garden, the Talk button, and Type instead.</p>
    <img src="/garden-concepts.png" alt="Three Kindred app designs. A is a lush living meadow. B is an illustrated storybook garden. C is a quiet watercolor grove. Each has Talk with Kindred and Type instead below the garden.">
    <p class="hint">On a phone, pinch to zoom in. Tell me whether you like <strong>A, B, or C</strong>, or what you would combine.</p>
  </main>
</body>
</html>
